name: workout_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Update this to at least 3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1  # Use the stable v2 for now unless you specifically need v3 features
  flutter_slidable: ^3.1.0
  freezed_annotation: ^2.4.4
  go_router: ^14.0.0       # Stable version for most projects
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  json_annotation: ^4.9.0
  path_provider: ^2.0.15
  riverpod_annotation: ^2.3.5
  uuid: ^4.5.3
  table_calendar: ^3.1.2 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.7.0
  isar_generator: ^3.1.0+1  # Adding this since you have Isar in dependencies

flutter:
  uses-material-design: true
